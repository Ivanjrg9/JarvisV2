<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171b36"/>
      <stop offset="1" stop-color="#07080f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d97757" stop-opacity=".30"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- fondo -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)" stroke="#2c3262" stroke-width="3" shape-rendering="geometricPrecision"/>
  <circle cx="256" cy="256" r="230" fill="url(#halo)" shape-rendering="geometricPrecision"/>

  <!-- anillo estilo Jarvis -->
  <g shape-rendering="geometricPrecision" fill="none">
    <circle cx="256" cy="256" r="222" stroke="#00d4ff" stroke-opacity=".18" stroke-width="3"/>
    <circle cx="256" cy="256" r="222" stroke="#00d4ff" stroke-opacity=".85" stroke-width="5" stroke-linecap="round"
            stroke-dasharray="120 60 40 60 200 60 80 60" transform="rotate(-20 256 256)"/>
    <circle cx="256" cy="256" r="206" stroke="#00d4ff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 10"/>
  </g>

  <!-- muñeco de Claude (pixel art) -->
  <!-- patas -->
  <g fill="#b9573a">
    <rect x="134" y="320" width="28" height="54"/>
    <rect x="206" y="320" width="28" height="54"/>
    <rect x="278" y="320" width="28" height="54"/>
    <rect x="350" y="320" width="28" height="54"/>
  </g>
  <!-- brazos -->
  <g fill="#cf6d4b">
    <rect x="76"  y="212" width="36" height="72"/>
    <rect x="400" y="212" width="36" height="72"/>
  </g>
  <!-- cuerpo -->
  <rect x="112" y="140" width="288" height="180" fill="#d97757"/>
  <rect x="112" y="140" width="288" height="18" fill="#ec9370"/>
  <rect x="112" y="302" width="288" height="18" fill="#c4623f"/>

  <!-- visor / escáner de KITT en lugar de los ojos -->
  <ellipse cx="256" cy="212" rx="170" ry="30" fill="#ff1a2e" opacity=".35" filter="url(#glow)" shape-rendering="geometricPrecision"/>
  <rect x="118" y="184" width="276" height="56" rx="8" fill="#07080f" stroke="#2a2d45" stroke-width="3"/>
  <g filter="url(#soft)" fill="#ff1a2e">
    <rect x="132" y="196" width="24" height="32" opacity=".14"/>
    <rect x="164" y="196" width="24" height="32" opacity=".30"/>
    <rect x="196" y="196" width="24" height="32" opacity=".62"/>
    <rect x="228" y="196" width="24" height="32" opacity="1"/>
    <rect x="260" y="196" width="24" height="32" opacity=".62"/>
    <rect x="292" y="196" width="24" height="32" opacity=".30"/>
    <rect x="324" y="196" width="24" height="32" opacity=".16"/>
    <rect x="356" y="196" width="24" height="32" opacity=".10"/>
  </g>
  <g fill="#ff7c88">
    <rect x="196" y="202" width="24" height="20" opacity=".5"/>
    <rect x="228" y="202" width="24" height="20" opacity="1"/>
    <rect x="260" y="202" width="24" height="20" opacity=".45"/>
  </g>
  <rect x="234" y="208" width="12" height="8" fill="#fff" opacity=".9"/>
</svg>
