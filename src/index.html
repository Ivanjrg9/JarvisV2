<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; img-src 'self' data:">
<title>JarvisV2</title>
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="../node_modules/@fontsource/inter/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/inter/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/inter/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/inter/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/jetbrains-mono/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/jetbrains-mono/700.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="topbar">
    <button id="btn-toggle" class="icon-btn" title="Mostrar u ocultar la barra lateral (Ctrl+B)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="10" rx="2.5"/><path d="M6 3v10"/></svg>
    </button>
    <img class="logo" src="../assets/icon.png" alt="">
    <div class="brand">Jarvis<span>V2</span></div>
    <button id="btn-palette" class="search" title="Buscar espacios y ejecutar acciones (Ctrl+K)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2L13.5 13.5"/></svg>
      <span>Buscar o ejecutar una acción…</span><kbd>Ctrl K</kbd>
    </button>
  </header>

  <div id="app">
    <aside id="sidebar">
      <div class="side-title">Espacios</div>
      <div id="ws-list"></div>
      <button id="btn-new" class="new-btn" title="Nuevo espacio de trabajo (Ctrl+Shift+N)">
        <span class="plus">+</span><span class="lbl">Nuevo espacio</span>
      </button>
    </aside>

    <main id="stage">
      <div id="empty" class="empty">
        <div class="empty-inner">
          <img class="big-logo" src="../assets/icon.png" alt="">
          <h1>Bienvenido a <span class="grad">JarvisV2</span></h1>
          <p>Organiza tus sesiones de Claude Code en espacios de trabajo, uno por proyecto.<br>Elige cómo quieres empezar:</p>
          <div id="empty-templates" class="templates"></div>
          <div class="tips">Consejo: pulsa <kbd>Ctrl</kbd> <kbd>K</kbd> en cualquier momento para buscar y ejecutar acciones.</div>
        </div>
      </div>
    </main>
  </div>

  <!-- Nuevo espacio -->
  <div id="modal" class="overlay hidden">
    <div class="card wide">
      <h3>Nuevo espacio de trabajo</h3>
      <div class="field">
        <label>Nombre</label>
        <input id="m-name" type="text" placeholder="Mi proyecto" spellcheck="false">
      </div>
      <div class="field">
        <label>Carpeta del proyecto</label>
        <div class="row">
          <input id="m-cwd" type="text" placeholder="C:\Users\..." spellcheck="false">
          <button id="m-browse" class="btn">Elegir…</button>
        </div>
      </div>
      <div class="field">
        <label>Distribución inicial</label>
        <div id="m-templates" class="templates small"></div>
      </div>
      <div class="field">
        <label>Color</label>
        <div id="m-colors" class="swatches"></div>
      </div>
      <div class="actions">
        <button id="m-cancel" class="btn">Cancelar</button>
        <button id="m-ok" class="btn primary">Crear espacio</button>
      </div>
    </div>
  </div>

  <!-- Confirmación -->
  <div id="dialog" class="overlay hidden">
    <div class="card">
      <h3 id="d-title"></h3>
      <p id="d-text"></p>
      <div class="actions">
        <button id="d-cancel" class="btn">Cancelar</button>
        <button id="d-ok" class="btn danger">Aceptar</button>
      </div>
    </div>
  </div>

  <!-- Paleta de comandos -->
  <div id="palette" class="overlay top hidden">
    <div class="pal">
      <input id="p-input" type="text" placeholder="Escribe para buscar un espacio o una acción…" spellcheck="false">
      <div id="p-list"></div>
      <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> moverse</span><span><kbd>Enter</kbd> ejecutar</span><span><kbd>Esc</kbd> cerrar</span></div>
    </div>
  </div>

  <div id="toasts"></div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
